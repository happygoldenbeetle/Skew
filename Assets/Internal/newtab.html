<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>New Tab</title>
  <style>
    /*
      Deliberately empty, the way Arc's new tab is: no clock, no search field,
      no wordmark. The page is transparent so the web card's own surface shows
      through and the tab reads as part of the chrome rather than as content.
      The browser is created with a transparent background colour, so nothing
      needs to paint here.

      The data-theme attribute is still set on <html> by the host when the
      light/dark theme changes; there is simply nothing styled by it yet.
    */
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body></body>
</html>
